name: Build and Deploy ShadowForge 3D to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten Compiler
        run: emcc -v

      - name: Configure CMake for WebAssembly (WebGL 2)
        run: emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build Web Target (HTML, JS, WASM)
        run: cmake --build build-web --config Release

      - name: Prepare Deployment Artifacts
        run: |
          mkdir -p public
          cp build-web/index.html public/
          cp build-web/index.js public/
          cp build-web/index.wasm public/
          if [ -f build-web/index.data ]; then cp build-web/index.data public/; fi
          ls -lh public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
