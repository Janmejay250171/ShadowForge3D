<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ShadowForge 3D — Spatial Shadow Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0d10;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #13171f 0%, #07080a 100%);
        }
        canvas.emscripten {
            border: 1px solid #1f2937;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(10, 186, 211, 0.15);
            max-width: 100vw;
            max-height: 100vh;
            outline: none;
            display: block;
            aspect-ratio: 16 / 9;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #08090c;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(10, 186, 211, 0.15);
            border-top: 3px solid #0abad3;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.9) infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #f3f4f6;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            letter-spacing: 2px;
            color: #0abad3;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #status-text {
            font-size: 13px;
            color: #9ca3af;
            letter-spacing: 1px;
            font-family: monospace;
        }
        #fs-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }
        #fs-btn:hover {
            color: #0abad3;
            border-color: #0abad3;
            background: rgba(17, 24, 39, 0.95);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="title">SHADOWFORGE 3D</div>
            <div class="subtitle">A 3D Spatial Shadow Puzzle</div>
            <div id="status-text">Compiling WebAssembly engine...</div>
        </div>

        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <button id="fs-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status-text');
        var loadingOverlay = document.getElementById('loading-overlay');

        var Module = {
            preRun: [],
            postRun: [function() {
                setTimeout(function() {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(function() {
                        loadingOverlay.style.display = 'none';
                        window.focus();
                        document.getElementById('canvas').focus();
                    }, 500);
                }, 300);
            }],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function(text) {
                if (text) {
                    statusElement.innerText = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Loading asset packages (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...' : 'All assets loaded.');
            }
        };

        function toggleFullscreen() {
            var canvas = document.getElementById('canvas');
            if (!document.fullscreenElement) {
                if (canvas.requestFullscreen) {
                    canvas.requestFullscreen();
                } else if (canvas.webkitRequestFullscreen) {
                    canvas.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.addEventListener('resize', resizeCanvas);
        function resizeCanvas() {
            var canvas = document.getElementById('canvas');
            var w = window.innerWidth;
            var h = window.innerHeight;
            var aspect = 16 / 9;
            if (w / h > aspect) {
                canvas.style.height = h + 'px';
                canvas.style.width = (h * aspect) + 'px';
            } else {
                canvas.style.width = w + 'px';
                canvas.style.height = (w / aspect) + 'px';
            }
        }
        resizeCanvas();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
